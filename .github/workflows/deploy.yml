name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Create GitHub App token (actions/create-github-app-token v3.2.0)
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Release Please (googleapis/release-please-action v5.0.0)
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

  build:
    name: Build Web
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build web
        run: flutter build web --release --no-pub --base-href /quick-chat/

      - name: Upload Pages artifact (actions/upload-pages-artifact v5.0.0)
        if: needs.release.outputs.release_created == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/web

  build-android:
    name: Build Android
    needs: release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Configure upload keystore
        if: needs.release.outputs.release_created == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::$secret is required to sign Google Play releases."
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle
        run: flutter build appbundle --release --no-pub

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Upload artifacts (actions/upload-artifact v7.0.2)
        if: needs.release.outputs.release_created == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing credentials
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

  deploy-android:
    name: Deploy Android to Google Play (internal)
    needs: [release, build-android]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: google-play
    steps:
      - name: Download Android release (actions/download-artifact v8)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android-release
          path: android-release

      - name: Authenticate to Google Play (google-github-actions/auth v3)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Publish to internal testing
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GOOGLE_PLAY_ACCESS_TOKEN:?Google Play access token is required}"
          bundle="android-release/bundle/release/app-release.aab"
          test -s "$bundle"
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.wilmarques.quick_chat"
          upload_api="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/com.wilmarques.quick_chat"
          auth_header="Authorization: Bearer $GOOGLE_PLAY_ACCESS_TOKEN"

          edit_id=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "$auth_header" -H 'Content-Type: application/json' \
            --data '{}' "$api/edits" | jq -er '.id | select(type == "string" and length > 0)')

          version_code=$(curl --fail-with-body --silent --show-error --max-time 600 \
            -X POST -H "$auth_header" -H 'Content-Type: application/octet-stream' \
            --data-binary "@$bundle" "$upload_api/edits/$edit_id/bundles?uploadType=media" \
            | jq -er '.versionCode | select(type == "number" and . > 0 and . == floor) | tostring')

          release=$(jq -n --arg version "$version_code" \
            '{track: "internal", releases: [{status: "completed", versionCodes: [$version]}]}')
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X PUT -H "$auth_header" -H 'Content-Type: application/json' \
            --data "$release" "$api/edits/$edit_id/tracks/internal"

          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "$auth_header" \
            "$api/edits/$edit_id:commit?changesInReviewBehavior=ERROR_IF_IN_REVIEW"
          echo "Published version code $version_code to Google Play internal testing."

  deploy:
    needs: [release, build]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (actions/configure-pages v6.0.0)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Deploy to GitHub Pages (actions/deploy-pages v5.0.1)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
